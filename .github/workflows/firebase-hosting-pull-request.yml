# Firebase Hosting Preview + QualiBot Visual Testing
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.firebase_deploy.outputs.details_url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUALI_BOT_DA8CD }}
          projectId: quali-bot-da8cd

  visual_test:
    name: QualiBot Visual Testing
    needs: build_and_preview
    runs-on: ubuntu-latest
    steps:
      - name: Run QualiBot
        uses: Jaspero/qb-workflow@main
        with:
          api-key: ${{ secrets.QUALIBOT_API_KEY }}
          org-id: ${{ secrets.QUALIBOT_ORG_ID }}
          project-id: ${{ secrets.QUALIBOT_PROJECT_ID }}
          target-url: ${{ needs.build_and_preview.outputs.preview_url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
